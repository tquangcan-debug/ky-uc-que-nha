name: San xuat video POV

on:
  workflow_dispatch:
    inputs:
      tap:
        description: "Ten file trong tap-pov (vd tap-1)"
        required: true
        default: "tap-1"
      privacy:
        description: "none (chi dung) | private (hen gio theo lich) | private-khong-hen"
        required: false
        default: "none"

permissions:
  contents: read
  issues: write

concurrency: san-xuat-pov

jobs:
  pov:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Ho_Chi_Minh
      IMAGE_PROVIDER: cloudflare
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_IMAGE_MODEL: ${{ vars.CF_IMAGE_MODEL || '@cf/black-forest-labs/flux-2-klein-4b' }}
      CF_W: "768"
      CF_H: "1344"
      FONT_FILE: ${{ github.workspace }}/fonts/BeVietnamPro-SemiBold.ttf
      FONT_NAME: Be Vietnam Pro SemiBold
      MUSIC_DIR: ${{ github.workspace }}/music
      SFX_DIR: ${{ github.workspace }}/sfx
      X264_PRESET: medium
      HF_HUB_DISABLE_TELEMETRY: "1"
      TTS_VOICE: vi-VN-NamMinhNeural
      TTS_RATE: "-6%"
      TTS_PITCH: "-4Hz"
      MUSIC_URL: ${{ vars.MUSIC_URL || 'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Evening%20Fall%20-%20Harp.mp3' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cai cong cu
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q edge-tts transformers opencv-python-headless pillow numpy google-api-python-client google-auth google-auth-oauthlib
          mkdir -p fonts music sfx
          curl -sL -o fonts/BeVietnamPro-SemiBold.ttf https://github.com/google/fonts/raw/main/ofl/bevietnampro/BeVietnamPro-SemiBold.ttf
          curl -fsL -o music/nhac.mp3 "$MUSIC_URL" || echo "khong tai duoc nhac"
          # Am thanh that (BigSoundBank, mien phi ban quyen)
          get() { curl -fsL -o "sfx/$1.mp3" "https://bigsoundbank.com/UPLOAD/mp3/$2.mp3" && echo "sfx $1 ok" || echo "sfx $1 KHONG tai duoc"; }
          get ga_gay 0283
          get chim 0222
          get nuoc 1302
          get buoc_chan 3216
          get cho_que 0869
          get nen_lang_que 0097
          ls -la sfx

      - name: Dung video POV
        run: |
          mkdir -p jobs/tap && cp "tap-pov/${{ github.event.inputs.tap }}"*.json jobs/tap/script.json
          python3 scripts/pov.py jobs/tap | tee jobs/render.log
          tail -1 jobs/render.log | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ok'], d"

      - name: Luu ban dung (tai ve trong 7 ngay)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-pov
          path: |
            jobs/tap/youtube.mp4
            jobs/tap/tiktok.mp4
            jobs/tap/thumb.jpg
          retention-days: 7

      - name: Tai len YouTube
        if: github.event.inputs.privacy != 'none'
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          MUSIC_CREDIT: "${{ vars.MUSIC_CREDIT || 'Nhạc - Evening Fall (Harp) Kevin MacLeod (incompetech.com) · Licensed under Creative Commons: By Attribution 4.0 · https://creativecommons.org/licenses/by/4.0/' }}"
        run: |
          if [ "${{ github.event.inputs.privacy }}" = "private-khong-hen" ]; then extra="--publish-at="; else extra=""; fi
          python3 scripts/yt_upload.py jobs/tap $extra
